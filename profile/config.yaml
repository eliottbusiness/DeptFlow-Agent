# Configuration HERMES — DeptFlow-Agent
# Agent de prospection B2B LinkedIn

llm:
  provider: openrouter
  default: anthropic/claude-sonnet-4-5
  fallback: nous-hermes-3
  temperature: 0.3
  max_tokens: 4096

streaming:
  enabled: true

approvals:
  mode: auto
  allowlist:
    - connect/linkedin/profile
    - message/linkedin
    - chats/linkedin

toolsets:
  - hermes-cli
  - web_search
  - execute_code
  - read_file
  - write_file
  - http_request

http_request:
  base_headers:
    Content-Type: application/json
    x-api-key: "${BEREACH_API_KEY}"
  base_url: https://api.bereach.co

display:
  personality: helpful
  language: fr

memory:
  enabled: true
  backend: file
  path: ./memory/

logging:
  level: info
  file: ./logs/hermes.log
  format: json

cron:
  timezone: Europe/Paris
  jobs:
    - name: detect_intent_signals
      schedule: "0 8 * * 1-5"
      skill: detect_intent_signals
      description: "Détection des signaux d'intention chaque matin en semaine à 8h"

    - name: check_inbox_midday
      schedule: "0 12 * * 1-5"
      skill: followup_and_relaunch
      description: "Suivi inbox LinkedIn à midi"

    - name: check_inbox_evening
      schedule: "0 18 * * 1-5"
      skill: followup_and_relaunch
      description: "Suivi inbox LinkedIn en soirée"

    - name: weekly_report
      schedule: "0 17 * * 5"
      skill: generate_report
      description: "Rapport hebdomadaire chaque vendredi à 17h"

env:
  bereach_api_key: "${BEREACH_API_KEY}"
  telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  llm_api_key: "${LLM_API_KEY}"
  llm_model: "${LLM_MODEL}"

skills_path: ./skills/
context_path: ./context/
client_config: ./client.yaml
